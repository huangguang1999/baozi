      - path: Sources/Baozi/Resources/cat_transmission_27.png
      - path: Sources/Baozi/Resources/cat_transmission_28.png
      - path: Sources/Baozi/Resources/cat_transmission_29.png
      - path: Sources/Baozi/Resources/cat_transmission_30.png
      - path: Sources/Baozi/Resources/cat_transmission_31.png
      - path: Sources/Baozi/Resources/cat_transmission_32.png
      - path: Sources/Baozi/Resources/cat_transmission_33.png
      - path: Sources/Baozi/Resources/cat_transmission_34.png
      - path: Sources/Baozi/Resources/cat_transmission_35.png
