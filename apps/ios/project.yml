    dependencies:
      - sdk: CarPlay.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - package: Hairball
        product: HairballUI
      - package: WebRTC
        product: WebRTC
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kris99.baozi
        INFOPLIST_KEY_CFBundleDisplayName: "包子"
        INFOPLIST_FILE: Sources/Baozi/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Baozi/Bridge/codex_bridge_objc.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIBackgroundModes: "audio fetch remote-notification picture-in-picture"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  BaoziMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    entitlements:
      path: Sources/Baozi/Baozi-Catalyst.entitlements
      properties:
        aps-environment: production
        # iCloud KVS sync (Feature C). Re-add when the iCloud container
        # `iCloud.com.kris99.baozi` exists in the Apple Developer Portal
        # AND the Mac App Store profile is regenerated to include the iCloud
        # capability. Direct-dist (DeveloperID entitlements) keeps the key
        # because Developer ID apps validate iCloud at runtime, not via profile.
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.kris99.baozi
        com.apple.security.application-groups:
          - group.com.kris99.baozi
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    sources:
      - path: Sources/Baozi
        excludes:
          - CarPlay/**
          - Info.plist
          - Baozi.entitlements
          - Baozi-Catalyst.entitlements
          - Baozi-Catalyst-DeveloperID.entitlements
          - Models/AppLifecycleController.swift
          - Models/AppRuntimeController.swift
          - Models/CodexTurnAttributes.swift
          - Models/CodexVoiceCallAttributes.swift
          - Models/OrientationResponder.swift
          - Models/RealtimeWebRtcSession.swift
          - Models/StableSafeAreaInsets.swift
          - Models/TurnLiveActivityController.swift
          - Models/VoiceRuntimeController.swift
          - Models/VoiceSessionControl.swift
          - Models/VoiceSessionModels.swift
          - Models/WatchCompanionBridge.swift
          - Models/WatchProjection.swift
          - Views/HomeVoiceOrbButton.swift
          - Views/InlineVoiceButton.swift
          - Views/InlineVoiceStatusStrip.swift
          - Views/LiveActivityPreview.swift
          - Views/LockScreenCardView.swift
          - Views/RealtimeVoiceScreen.swift
          - Views/VoiceCallView.swift
          - "**/*.h"
      - path: Sources/Baozi/Bridge/UniFFICodexClient.generated.swift
    resources:
      - path: Sources/Baozi/Resources/Fonts
      - path: Sources/Baozi/Resources/Themes
      - path: Sources/Baozi/Resources/TipJarProducts.storekit
      - path: Sources/Baozi/Resources/home_cat.png
      - path: Sources/Baozi/Resources/home_cat_entrance.png
      - path: Sources/Baozi/Resources/cat_transmission_01.png
      - path: Sources/Baozi/Resources/cat_transmission_02.png
      - path: Sources/Baozi/Resources/cat_transmission_03.png
      - path: Sources/Baozi/Resources/cat_transmission_04.png
      - path: Sources/Baozi/Resources/cat_transmission_05.png
      - path: Sources/Baozi/Resources/cat_transmission_06.png
      - path: Sources/Baozi/Resources/cat_transmission_07.png
      - path: Sources/Baozi/Resources/cat_transmission_08.png
      - path: Sources/Baozi/Resources/cat_transmission_09.png
      - path: Sources/Baozi/Resources/cat_transmission_10.png
      - path: Sources/Baozi/Resources/cat_transmission_11.png
      - path: Sources/Baozi/Resources/cat_transmission_12.png
      - path: Sources/Baozi/Resources/cat_transmission_13.png
      - path: Sources/Baozi/Resources/cat_transmission_14.png
      - path: Sources/Baozi/Resources/cat_transmission_15.png
      - path: Sources/Baozi/Resources/cat_transmission_16.png
