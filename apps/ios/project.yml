name: Baozi
options:
  bundleIdPrefix: com.kris99
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true

# DeveloperID is a release-style configuration used by the Mac Catalyst
# direct-distribution lane (notarized .dmg). It points the BaoziMac target
# at a separate, unsandboxed entitlements file so the app can spawn a local
# `codex app-server`. The Mac App Store lane stays on Release with sandbox.
configs:
  Debug: debug
  Release: release
  DeveloperID: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Baozi/Bridge/codex_bridge_objc.h
    OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client"
    HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-device"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-sim"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: DDZU3W897W
    # Xcode 15+ explicit-module builds. First clean build is slightly
    # slower, but module graphs are cached per-target after that, so
    # incremental Swift compiles in the app target drop substantially.
    SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
    CLANG_ENABLE_EXPLICIT_MODULES: "YES"

packages:
  Hairball:
    url: https://github.com/dnakov/hairball.git
    branch: main
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  Baozi:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/Baozi/Baozi.entitlements
      properties: {}
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: true
    sources:
      - path: Sources/Baozi
        excludes:
          - "**/*.h"
          - "AppIcon.icon"
      - path: Sources/Baozi/Bridge/UniFFICodexClient.generated.swift
      - path: Sources/BaoziLiveActivity/CodexTurnLiveActivity.swift
      - path: Sources/BaoziWatch/Models/WatchModels.swift
      - path: Sources/BaoziWatch/Models/WatchSize.swift
      - path: Sources/BaoziWatch/Models/WatchHapticDetector.swift
      - path: Sources/BaoziWatch/Models/WatchSnapshotStore.swift
      - path: Sources/BaoziWatch/Models/WatchDeepLinkRouter.swift
      - path: Sources/BaoziWatchComplications/BaoziServerListPayload.swift
      - path: Sources/BaoziWatchComplications/BaoziComplicationEntry.swift
      - path: Sources/BaoziWatchComplications/BaoziRunningTurnPayload.swift
    resources:
      - path: Sources/Baozi/Resources/Fonts
      - path: Sources/Baozi/Resources/Themes
      - path: Sources/Baozi/Resources/TipJarProducts.storekit
      - path: Sources/Baozi/Resources/home_cat.png
      - path: Sources/Baozi/Resources/home_cat_entrance.png
      - path: Sources/Baozi/Resources/cat_transmission_01.png
      - path: Sources/Baozi/Resources/cat_transmission_02.png
      - path: Sources/Baozi/Resources/cat_transmission_03.png
      - path: Sources/Baozi/Resources/cat_transmission_04.png
