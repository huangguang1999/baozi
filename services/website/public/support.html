<body>

  <nav>
    <div class="container">
      <a href="/" class="nav-brand">
        <img src="/app-icon.png" alt="包子 icon">
        <span>包子</span>
      </a>
      <div class="nav-links">
        <a href="https://github.com/huangguang1999/baozi">GitHub</a>

  <div class="container">
    <section class="support">
      <h1>支持</h1>
      <p>使用包子遇到问题？下面是联系我们的方式。</p>

      <div class="support-cards">
        <div class="support-card">
          <h3>邮箱</h3>
          <p>一般咨询、Bug 反馈或建议，请发邮件到 <a href="mailto:huangguang1999@163.com">huangguang1999@163.com</a>。</p>
        </div>
        <div class="support-card">
          <h3>常见问题</h3>
          <p><strong>找不到我的服务器？</strong>请确认你的设备和 Codex 服务器处于同一网络，或者配置一个 SSH 连接用于远程访问。</p>
        </div>
        <div class="support-card">
          <h3>账号删除</h3>
          <p>包子不创建账号，也不在我们的服务器上存储个人数据。要删除全部本地数据，卸载本应用即可。</p>
        </div>
      </div>
    </section>
  </div>

    <div class="container">
      <div class="footer-left">
        <div class="footer-brand">
          <img src="/app-icon.png" alt="">
